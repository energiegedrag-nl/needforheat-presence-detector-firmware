name: Build CI
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 8 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # List all of the PlatformIO platforms to build
        platformio_env:
          - ESP32DEV
          - M5STACK_COREINK
        
    steps:
      # Checkout repository.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Setup Python (needed by PlatformIO)
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # Setup PlatformIO.
      - name: Setup PlatformIO
        run: pip install platformio
      
      # Build the PlatformIO project.
      - name: Build PlatformIO project
        env:
          PLATFORMIO_ENV: ${{ matrix.platformio_env }}
          PLATFORMIO_BUILD_FLAGS: -DCONFIG_TWOMES_TEST_SERVER
        run: pio run -e $PLATFORMIO_ENV
